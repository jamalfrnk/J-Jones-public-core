schema_version: 1
register_kind: public_core_mechanism_register
register_status: owner_approved_for_planning
last_reviewed: 2026-11-16
owner_approval: approved_as_classified
owner_approval_date: 2026-11-16

# This file is an engineering release-boundary inventory. It is not a patent
# application, claim chart, legal opinion, or substitute for counsel. It must
# not contain patent claims, private canonical content, raw evidence,
# credentials, tokens, or private provider responses.

classification_policy:
  evidence_basis: observed_from_current_repository
  legal_review_status: not_a_legal_opinion
  default_public_treatment: review_required
  default_unclassified_treatment: exclude_until_review
  public_core_principles:
    - local_first
    - model_agnostic
    - canonical_knowledge_remains_governed
    - derived_state_is_rebuildable
    - external_disclosure_is_explicit_and_minimal
    - public_interfaces_do_not_grant_canonical_write_authority
  public_core_scope:
    - generic_replaceable_infrastructure
    - local_only_functionality
    - provider_neutral_interfaces
    - deterministic_local_retrieval
    - rebuildable_derived_indexes
    - screened_public_export_interfaces
    - generic_storage_and_integrity_interfaces

decision_values:
  - include_candidate
  - generic_interface
  - review_required
  - exclude_from_public_core
  - deferred

mechanisms:
  - id: PCM-001
    name: generic_note_front_matter_interface
    description: >
      Parse, render, and validate structured note metadata without publishing
      J-Jones-specific authority, claim, sensitivity, or canonical taxonomy.
    category: public_candidate
    priority: P2
    confidence: high
    module_paths:
      - src/jjones/memory/notes.py
    symbols:
      - NoteTypeRule
      - parse_front_matter
      - render_note
      - validate_note_metadata
      - validate_note_text
      - validate_note_file
    public_core_treatment: generic_interface
    owner_decision: approved_as_classified
    public_interface_allowed: true
    private_implementation_required: true
    state_locations:
      module_globals:
        - BASELINE_REQUIRED_FIELDS
        - NOTE_TYPE_RULES
      instance_state: []
      durable_state: []
      derived_state: []
    excluded_private_behavior:
      - J-Jones-specific note taxonomy
      - claim authority rules
      - private sensitivity policy
      - canonical admission policy
    security_effect: Generic validation must fail closed on malformed metadata.
    privacy_effect: The parser must not read or disclose private content beyond its explicit input.
    canonical_knowledge_effect: Parsing and validation must not create or mutate canonical knowledge.
    evidence_status: observed_from_current_repository

