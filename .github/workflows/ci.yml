name: Public Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Format check
        run: uv run --extra dev ruff format --check .
      - name: Lint
        run: uv run --extra dev ruff check .
      - name: Type check
        run: uv run --extra dev mypy src
      - name: Security lint
        run: uv run --extra dev bandit -c pyproject.toml -r src
      - name: Tests
        run: uv run --extra dev pytest --cov=jjones_core --cov-report=term-missing
      - name: Build package
        run: uv build
      - name: Dependency audit
        run: uv run --extra dev pip-audit
      - name: Secret scan
        run: uv run --extra dev detect-secrets scan --all-files --exclude-files "(^|/)(\\.venv|\\.pytest_cache|\\.ruff_cache|\\.mypy_cache|dist)(/|$)"
